<!doctype html>
<html lang="zh" data-resizable="1">
<head>
<meta charset="utf-8" />
<title>项目知识库 · BocomHermes</title>
<!--
  项目知识库(独立视图,从设置页抽出):Agent 蒸馏的系统级事实,按项目落盘,注入后续会话。
  查看 / 健康检查(C1-C4 体检三色:绿正常/黄建议修/红隔离不注入) / 编辑 / 删除 / 恢复(修锚点自动复检)。
  knowledge* 通道缺席时空态静默,绝不抛。?embed=1 嵌入主窗口(shell「知识库」入口直达本页)。
-->
<script>try { document.documentElement.dataset.theme = window.BocomHermes.getTheme() || 'light' } catch (e) { document.documentElement.dataset.theme = 'light' }</script>
<script>(function(){try{var p=new URLSearchParams(location.search);if(p.has('embed'))document.documentElement.dataset.embed='1'}catch(e){}})()</script>
<link rel="stylesheet" href="glass.css" />
<style>
  .mc { display: flex; flex-direction: column; height: 100%; padding: 11px 13px 12px; gap: 10px; }
  .hd { display: flex; align-items: center; gap: 9px; flex: none; }
  .hd .ttl { font-size: 14px; font-weight: 600; flex: none; }
  .hd .sp { flex: 1; }
  .hbtn { border: none; background: transparent; color: var(--txt3); cursor: pointer; padding: 4px; border-radius: 7px; display: flex; }
  .hbtn:hover { color: var(--txt); background: var(--composer-bg); }
  html[data-embed="1"] .hd .hbtn { display: none; }
  .kn-bar { display: flex; align-items: center; gap: 7px; flex: none; }
  .kn-bar select.in { flex: 1; min-width: 0; }
  .hint { font-size: 11px; color: var(--txt3); line-height: 1.6; }
  /* 项目知识库:条目卡 + 体检三色(绿默认/黄警示/红隔离) */
  .kn-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; padding-right: 2px; }
  .kn-list::-webkit-scrollbar { width: 6px; } .kn-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
  .kn-item { background: var(--composer-bg); border: .5px solid var(--composer-border); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .kn-item.kn-yellow { background: var(--warn-bg); border-color: var(--warn-border); }
  .kn-item.kn-red { background: var(--diff-del-bg); border-color: var(--diff-del); }
  .kn-meta { display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--txt3); flex-wrap: wrap; }
  .kn-status { font-size: 9px; flex: none; }
  .kn-conf { font-size: 9.5px; font-weight: 600; border-radius: 999px; padding: 0 7px; line-height: 15px; background: var(--fill-1); color: var(--txt2); border: .5px solid var(--sep); }
  .kn-text { font-size: 12px; color: var(--txt); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .kn-anchors { font-family: var(--mono); font-size: 10.5px; color: var(--txt3); word-break: break-all; }
  .kn-reasons { font-size: 10.5px; line-height: 1.5; }
  .kn-ops { display: flex; gap: 6px; margin-top: 2px; }
  .kn-ops .chip { font-size: 10.5px; padding: 2px 9px; }
  .kn-edit { display: flex; flex-direction: column; gap: 5px; border-top: .5px dashed var(--composer-border); padding-top: 6px; }
  .kn-edit .in { font-size: 12px; }
  .kn-edit textarea.in { resize: vertical; min-height: 54px; font-family: var(--font); }
</style>
</head>
<body>
<div class="glass">
  <span class="hl"></span>
  <div class="mc">
    <div class="hd">
      <span class="ttl">项目知识库</span>
      <span class="sp"></span>
      <button id="x" class="hbtn nodrag" title="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="kn-bar nodrag">
      <select id="knProject" class="in"></select>
      <button id="knReload" class="chip">刷新</button>
      <button id="knAudit" class="chip" title="逐条体检：锚点失效 / 内容陈旧 / 重复会标黄或标红">健康检查</button>
    </div>
    <span id="knStats" class="hint"></span>
    <div id="knList" class="kn-list nodrag"></div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id)
  const base = (p) => String(p || '').split(/[\\/]/).pop() || p
  let cur = {}
  try { cur = window.BocomHermes.getSettings() || {} } catch (e) {}
  window.BocomHermes.onTheme && window.BocomHermes.onTheme((t) => { document.documentElement.dataset.theme = t })
  const EMBED = new URLSearchParams(location.search).has('embed')
  $('x').addEventListener('click', () => window.BocomHermes.closeSelf())
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !EMBED) window.BocomHermes.closeSelf() })

  // ── 项目知识库(查看/体检/编辑/删除/恢复;knowledge* 通道缺席时空态静默,绝不抛)────
  const knSel = $('knProject'), knListEl = $('knList'), knStats = $('knStats'), knAuditBtn = $('knAudit')
  const escH = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  // 项目来源:当前项目目录 + 最近仓库(去重);一个都没有就给引导空态
  ;(function fillKnProjects() {
    const seen = new Set(), dirs = []
    if (cur.projectDir) dirs.push(cur.projectDir)
    for (const d of (cur.recentDirs || [])) dirs.push(d)
    knSel.innerHTML = ''
    const uniq = dirs.filter((d) => d && !seen.has(d) && seen.add(d))
    if (!uniq.length) { knSel.innerHTML = '<option value="">（先在设置里选择当前项目目录）</option>'; knSel.disabled = true; return }
    for (const d of uniq) { const o = document.createElement('option'); o.value = d; o.textContent = base(d); o.title = d; knSel.appendChild(o) }
    knSel.value = (cur.projectDir && seen.has(cur.projectDir)) ? cur.projectDir : uniq[0]
  })()
  let knEntries = []   // 最近一次 list 结果;体检后就地刷新状态,不整表重拉
  function paintKnStats(total, audit) {
    if (audit) knStats.textContent = '共 ' + (total || 0) + ' 条 · 绿 ' + (audit.green || 0) + ' / 黄 ' + (audit.yellow || 0) + ' / 红 ' + (audit.red || 0)
    else knStats.textContent = total ? '共 ' + total + ' 条（未体检）' : ''
  }
  async function loadKnowledge() {
    const dir = knSel.disabled ? '' : knSel.value
    knEntries = []
    if (!dir) { knListEl.innerHTML = '<span class="hint">先在设置里「当前项目目录」选一个仓库 —— 知识库按项目落盘。</span>'; paintKnStats(0); return }
    if (typeof window.BocomHermes.knowledgeList !== 'function') { knListEl.innerHTML = '<span class="hint">知识库后端通道尚未接入（本版壳未带），接入后此处自动可用。</span>'; paintKnStats(0); return }
    knListEl.innerHTML = '<span class="hint">读取中…</span>'
    let r = null
    try { r = await window.BocomHermes.knowledgeList(dir) } catch (e) { r = { ok: false, err: String((e && e.message) || e) } }
    if (!r || r.ok === false) { knListEl.innerHTML = '<span class="hint">读取失败：' + escH((r && (r.err || r.error)) || '未知错误') + '</span>'; paintKnStats(0); return }
    knEntries = Array.isArray(r.entries) ? r.entries : []
    paintKnStats((r.stats && r.stats.total) != null ? r.stats.total : knEntries.length)
    renderKnList()
  }
  function renderKnList() {
    knListEl.innerHTML = ''
    if (!knEntries.length) {
      knListEl.innerHTML = '<span class="hint">还没有知识条目 —— 工作流收尾时 Agent 会自动蒸馏系统级事实到这里（命令踩坑、环境事实、项目约定…），后续会话自动注入。</span>'
      return
    }
    for (const e of knEntries) knListEl.appendChild(buildKnItem(e))
  }
  function buildKnItem(e) {
    const el = document.createElement('div'); el.className = 'kn-item'; el.dataset.index = e.index
    const meta = document.createElement('div'); meta.className = 'kn-meta'
    const st = document.createElement('span'); st.className = 'kn-status'; st.textContent = '●'; st.style.color = 'var(--txt3)'; st.title = '未体检'
    meta.appendChild(st)
    if (e.date) { const d = document.createElement('span'); d.textContent = e.date; meta.appendChild(d) }
    if (e.confidence != null && e.confidence !== '') {
      const c = document.createElement('span'); c.className = 'kn-conf'
      const cv = +e.confidence
      c.textContent = '置信 ' + (Number.isFinite(cv) && cv <= 1 ? Math.round(cv * 100) + '%' : e.confidence)
      meta.appendChild(c)
    }
    if (e.scene) { const sc = document.createElement('span'); sc.textContent = '场景:' + e.scene; meta.appendChild(sc) }
    el.appendChild(meta)
    const tx = document.createElement('div'); tx.className = 'kn-text'; tx.textContent = e.text || e.raw || ''; el.appendChild(tx)
    const anchors = Array.isArray(e.anchors) ? e.anchors : []
    if (anchors.length) { const an = document.createElement('div'); an.className = 'kn-anchors'; an.textContent = '⚓ ' + anchors.join(' · '); el.appendChild(an) }
    const ops = document.createElement('div'); ops.className = 'kn-ops'
    const ed = document.createElement('button'); ed.className = 'chip'; ed.textContent = '编辑'
    ed.addEventListener('click', () => openKnEdit(el, e))
    const del = document.createElement('button'); del.className = 'chip'; del.textContent = '删除'
    del.addEventListener('click', async () => {
      // 两步确认:3s 不复原则复位
      if (!del.classList.contains('confirm')) {
        del.classList.add('confirm'); del.textContent = '删?'; del.style.color = 'var(--diff-del)'
        setTimeout(() => { del.classList.remove('confirm'); del.textContent = '删除'; del.style.color = '' }, 3000)
        return
      }
      if (typeof window.BocomHermes.knowledgeDelete !== 'function') return
      try { await window.BocomHermes.knowledgeDelete(knSel.value, [e.index]) } catch (e2) {}
      loadKnowledge()
    })
    ops.append(ed, del); el.appendChild(ops)
    return el
  }
  function openKnEdit(itemEl, e, opts) {
    if (itemEl.querySelector('.kn-edit')) return   // 已在编辑态
    const restoring = !!(opts && opts.restore)
    const box = document.createElement('div'); box.className = 'kn-edit'
    if (restoring) {
      const tip = document.createElement('div'); tip.style.cssText = 'font-size:11.5px;color:var(--accent)'
      tip.textContent = '恢复隔离条目:确认或修正锚点后保存 —— 保存即自动复检,锚点有效就回到绿标重新注入。'
      box.appendChild(tip)
    }
    const ta = document.createElement('textarea'); ta.className = 'in'; ta.value = e.text || e.raw || ''
    const sc = document.createElement('input'); sc.className = 'in'; sc.value = e.scene || ''; sc.placeholder = '场景（可选）'
    const an = document.createElement('input'); an.className = 'in'; an.value = (Array.isArray(e.anchors) ? e.anchors : []).join(', '); an.placeholder = '锚点，逗号分隔（可选）'
    const row = document.createElement('div'); row.className = 'row'
    const ok = document.createElement('button'); ok.className = 'chip'; ok.textContent = restoring ? '保存并复检' : '保存'
    const no = document.createElement('button'); no.className = 'chip'; no.textContent = '取消'
    row.append(ok, no); box.append(ta, sc, an, row); itemEl.appendChild(box)
    if (restoring) an.focus()
    ok.addEventListener('click', async () => {
      if (typeof window.BocomHermes.knowledgeEdit !== 'function') return
      const patch = {
        text: ta.value.trim(),
        scene: sc.value.trim(),
        anchors: an.value.split(/[,，;；\n]/).map((s) => s.trim()).filter(Boolean),
      }
      try { await window.BocomHermes.knowledgeEdit(knSel.value, e.index, patch) } catch (e2) {}
      await loadKnowledge()
      if (restoring) knAuditBtn.click()   // 恢复场景:保存完自动复检,绿了就是真恢复
    })
    no.addEventListener('click', () => box.remove())
  }
  // 健康检查:按 status 就地给条目上色(不整表重拉),头部亮绿/黄/红计数;红标行内亮「恢复」
  knAuditBtn.addEventListener('click', async () => {
    const dir = knSel.disabled ? '' : knSel.value
    if (!dir || typeof window.BocomHermes.knowledgeAudit !== 'function') return
    knAuditBtn.disabled = true
    let r = null
    try { r = await window.BocomHermes.knowledgeAudit(dir) } catch (e) { r = { ok: false, err: String((e && e.message) || e) } }
    knAuditBtn.disabled = false
    if (!r || r.ok === false) {
      knStats.textContent = '体检失败：' + ((r && (r.err || r.error)) || '未知错误')
      return
    }
    const byIndex = new Map((Array.isArray(r.entries) ? r.entries : []).map((a) => [a.index, a]))
    for (const child of knListEl.children) {
      const a = byIndex.get(+child.dataset.index); if (!a) continue
      child.classList.toggle('kn-yellow', a.status === 'yellow')
      child.classList.toggle('kn-red', a.status === 'red')
      const st = child.querySelector('.kn-status')
      if (st) {
        st.style.color = a.status === 'green' ? 'var(--green)' : a.status === 'yellow' ? 'var(--warn-txt)' : 'var(--diff-del)'
        st.title = a.status === 'green' ? '正常' : a.status === 'yellow' ? '黄标(建议修)' : '红标(已隔离,不再注入)'
      }
      let rl = child.querySelector('.kn-reasons')
      const reasons = Array.isArray(a.reasons) ? a.reasons : []
      if (reasons.length && a.status !== 'green') {
        if (!rl) { rl = document.createElement('div'); rl.className = 'kn-reasons'; child.insertBefore(rl, child.querySelector('.kn-ops')) }
        rl.style.color = a.status === 'red' ? 'var(--diff-del)' : 'var(--warn-txt)'
        rl.textContent = (a.status === 'red' ? '⛔ ' : '⚠ ') + reasons.join('；')
      } else if (rl) rl.remove()
      // 「恢复」动作(隔离是保护不是删除):红标条目行内亮恢复 → 修正锚点保存即恢复并自动复检
      const ops = child.querySelector('.kn-ops')
      if (ops && a.status === 'red' && !ops.querySelector('.kn-restore')) {
        const idx = +child.dataset.index
        const e = knEntries.find((x) => x.index === idx)
        const rs = document.createElement('button'); rs.className = 'chip kn-restore'; rs.textContent = '恢复'
        rs.title = '锚点已失效被隔离 —— 修正锚点(或确认无误)后保存即恢复,并自动复检'
        rs.style.color = 'var(--accent)'
        rs.addEventListener('click', () => { if (e) openKnEdit(child, e, { restore: true }) })
        ops.insertBefore(rs, ops.firstChild)
      }
    }
    if (r.stats) paintKnStats(r.stats.total, r.stats)
  })
  $('knReload').addEventListener('click', loadKnowledge)
  knSel.addEventListener('change', loadKnowledge)
  loadKnowledge()
</script>
</body>
</html>
