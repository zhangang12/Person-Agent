<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>BocomHermes</title>
<script>try { document.documentElement.dataset.theme = window.BocomHermes.getTheme() || 'light' } catch (e) { document.documentElement.dataset.theme = 'light' }</script>
<link rel="stylesheet" href="glass.css" />
<style>
  /* ── 桌面主窗口壳(波1 骨架,布局照 docs/ui-design/desktop.html 的 W1)──
     本页是顶层窗口自身,不是嵌入页:手动关掉 glass.css 的透明悬浮假设(实底 + body 无 padding),
     色值一律用 glass.css 令牌,双主题由 html[data-theme] 驱动。 */
  html, body { background: var(--glass-bg); }
  body { padding: 0; }
  #app { height: 100%; display: grid; grid-template-rows: 38px 1fr 28px; }

  /* ── 标题栏 ── */
  #tbar { display: flex; align-items: center; gap: 9px; padding: 0 14px; background: var(--composer-bg);
    border-bottom: .5px solid var(--composer-border); -webkit-app-region: drag; }
  #tbar.mac { padding-left: 82px; }   /* mac 红绿灯 hiddenInset 占位 */
  #tbar .tt { font-size: 13px; font-weight: 600; color: var(--txt2); }
  #tbar .sp { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px;
    background: var(--composer-bg); border: .5px solid var(--composer-border);
    font-size: 11px; font-weight: 500; color: var(--txt2); white-space: nowrap; -webkit-app-region: no-drag; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .ibtn { width: 26px; height: 26px; border: none; border-radius: 7px; background: transparent; color: var(--txt3);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; -webkit-app-region: no-drag; }
  .ibtn:hover { color: var(--txt); background: var(--hover); }
  .ibtn svg { width: 15px; height: 15px; }

  /* ── 主区:侧栏 228 + 视图区 ── */
  #body { display: grid; grid-template-columns: 228px 1fr; min-height: 0; }
  #side { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; overflow: hidden;
    background: var(--composer-bg); border-right: .5px solid var(--composer-border); }
  #logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px; font-size: 14px; font-weight: 600; color: var(--accent); }
  #logo b { color: var(--txt); font-weight: 600; }
  #logo svg { width: 18px; height: 18px; }
  #newChat { margin: 0 4px 10px; width: calc(100% - 8px); height: 30px; border: none; border-radius: 8px; cursor: pointer;
    background: var(--brand); color: var(--send-fg); font-size: 12.5px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  #newChat:hover { filter: brightness(1.08); }
  #newChat svg { width: 13px; height: 13px; }
  .lab { font-size: 10px; color: var(--txt3); letter-spacing: .08em; padding: 10px 8px 4px; }
  /* 波2:会话+历史列表(可滚动区,导航/设置钉在列表之外) */
  #sideLists { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #sessList { display: flex; flex-direction: column; gap: 1px; }
  #histList { display: flex; flex-direction: column; gap: 1px; }
  .sess { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; font-size: 12.5px; color: var(--txt); cursor: pointer; }
  .sess:hover { background: var(--hover); }
  .sess.on { background: var(--sel-bg); }
  .sess .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .sess .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .wfbd { flex: none; font-size: 9.5px; color: var(--accent); border: .5px solid var(--accent); border-radius: 4px; padding: 0 4px; line-height: 14px; }
  .sess .spin { flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--txt3); border-top-color: transparent; animation: sh-spin 1s linear infinite; }
  @keyframes sh-spin { to { transform: rotate(360deg); } }
  .sess .x { flex: none; width: 16px; height: 16px; border: none; border-radius: 4px; background: transparent; color: var(--txt3);
    cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 12px; line-height: 1; padding: 0; }
  .sess:hover .x { display: inline-flex; }
  .sess .x:hover { background: var(--composer-border); color: var(--txt); }
  /* 波3:钉出钮(与 × 并排,hover 现身)+ 拖出手势态 */
  .sess .pin { flex: none; width: 16px; height: 16px; border: none; border-radius: 4px; background: transparent; color: var(--txt3);
    cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 11px; line-height: 1; padding: 0; }
  .sess:hover .pin { display: inline-flex; }
  .sess .pin:hover { background: var(--composer-border); color: var(--txt); }
  .sess.dragging { opacity: .45; }
  .dragGhost { position: fixed; z-index: 99; pointer-events: none; padding: 5px 10px; border-radius: 7px;
    background: var(--composer-bg); border: .5px solid var(--composer-border); font-size: 12px; color: var(--txt);
    box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .sess-sub { font-size: 10.5px; color: var(--txt3); padding-left: 22px; margin-top: -2px; padding-bottom: 3px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: none; border-radius: 7px;
    background: transparent; font-size: 12.5px; color: var(--txt2); cursor: pointer; text-align: left; width: 100%; }
  .nav-item:hover { background: var(--hover); }
  .nav-item.on { background: var(--sel-bg); color: var(--txt); }
  .nav-item svg { width: 15px; height: 15px; flex: none; }
  #side .grow { flex: 1; }

  /* ── 视图区:四容器同时只显一个;webview 懒创建且保活(切走只是 display:none)── */
  #main { min-width: 0; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; }
  .view.on { display: flex; }
  .view webview { flex: 1; min-height: 0; display: flex; border: none; }
  /* 对话空态 */
  #chatEmpty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 40px; }
  #chatEmpty .eg { font-size: 13px; color: var(--txt3); line-height: 1.8; text-align: center; max-width: 460px; }
  #chatEmpty .eg code { font-family: var(--mono); font-size: 12px; background: var(--composer-bg); padding: 1px 6px; border-radius: 5px; color: var(--c-code); }
  #chatEmpty button { height: 34px; padding: 0 20px; border: none; border-radius: 9px; cursor: pointer;
    background: var(--brand); color: var(--send-fg); font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px; }
  #chatEmpty button:hover { filter: brightness(1.08); }
  #chatEmpty button svg { width: 14px; height: 14px; }

  /* ── 状态栏 ── */
  #sbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--composer-bg);
    border-top: .5px solid var(--composer-border); font-size: 11px; color: var(--txt3); }
  #sbar .sp { flex: 1; }
  #sbar svg { width: 11px; height: 11px; vertical-align: -1.5px; margin-right: 4px; }
  /* 波4:引擎灯(绿=健康端口;灰=失连/未连接);会话忙数高亮 */
  #sbEng .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--txt3); margin-right: 5px; }
  #sbEng.ok .dot { background: var(--green); }
  #sbEng.ok #sbEngTx { color: var(--txt2); }
  #sbSess .busyN { color: var(--accent); font-weight: 600; }

  /* ── 快捷输入层(波4):视图区顶部居中浮层(气质参照 docs/ui-design/desktop.html S1 输入容器:
     20px 圆角 + 玻璃阴影;令牌全吃 glass.css)。遮罩点击/Esc 关闭;淡入 150ms ease-out scale .97→1 ── */
  #quickMask { position: absolute; inset: 0; z-index: 50; display: none; align-items: flex-start; justify-content: center;
    background: rgba(20, 24, 40, .18); }
  #quickMask.on { display: flex; }
  #quickIn { margin-top: 72px; width: min(560px, calc(100% - 64px)); border-radius: 20px; padding: 12px 16px 9px;
    background: var(--glass-bg); border: .5px solid var(--glass-border); box-shadow: var(--glass-shadow);
    opacity: 0; transform: scale(.97); transition: opacity .15s ease-out, transform .15s ease-out; }
  #quickIn.in { opacity: 1; transform: scale(1); }
  #qiTa { display: block; width: 100%; box-sizing: border-box; border: none; outline: none; resize: none;
    background: transparent; color: var(--txt); font-family: var(--font); font-size: 13.5px; line-height: 20px;
    max-height: 120px; overflow-y: auto; padding: 2px 0; }
  #qiTa::placeholder { color: var(--txt3); }
  #qiHint { margin-top: 6px; font-size: 10.5px; color: var(--txt3); display: flex; gap: 12px; }
</style>
</head>
<body>
<div id="app">
  <!-- 标题栏:整栏拖动,按钮 no-drag;win32 的 min/max/close 由主进程 titleBarOverlay 提供 -->
  <header id="tbar">
    <span class="tt">BocomHermes</span>
    <span class="sp"></span>
    <span class="chip" id="engineChip" title="引擎连接状态(保活心跳推送,与状态栏引擎灯同源)"><span class="dot" id="chipDot" style="background:var(--txt3)"></span><span id="chipTx">引擎未连接</span></span>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div id="body">
    <!-- 侧栏 -->
    <aside id="side">
      <div id="logo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3z"/></svg>
        <b>BocomHermes</b>
      </div>
      <button id="newChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建对话
      </button>
      <div class="lab">会话</div>
      <div id="sideLists">
        <div id="sessList"></div>
        <div class="lab" id="histLab" style="display:none">历史</div>
        <div id="histList"></div>
      </div>
      <div class="lab">导航</div>
      <button class="nav-item on" data-view="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
        对话
      </button>
      <button class="nav-item" data-view="orch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>
        任务编排
      </button>
      <button class="nav-item" data-view="mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 8 9 5.5L21 8"/></svg>
        邮件中心
      </button>
      <button class="nav-item" data-view="browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 5.7 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.7-4-9s1.5-6.4 4-9z"/></svg>
        内嵌浏览器
      </button>
      <button class="nav-item" data-view="kb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        知识库
      </button>
      <span class="grow"></span>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
        设置
      </button>
    </aside>

    <!-- 视图区 -->
    <main id="main">
      <section class="view on" id="view-chat">
        <div id="chatEmpty">
          <div class="eg">试试:「月度结息金额和核心系统对不上,帮我看下 <code>InterestCalc.monthly()</code> 的逻辑」</div>
          <button id="newChatBig">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            新建对话
          </button>
        </div>
      </section>
      <section class="view" id="view-orch"></section>
      <section class="view" id="view-mail"></section>
      <section class="view" id="view-settings"></section>

      <!-- 快捷输入层(波4):Ctrl+Shift+Space 唤起,Enter 开新会话(带首发消息);Ctrl+Shift+V 预填剪贴板 -->
      <div id="quickMask">
        <div id="quickIn">
          <textarea id="qiTa" rows="1" placeholder="问点什么,Enter 即开新会话…"></textarea>
          <div id="qiHint"><span>Enter 发送</span><span>Shift+Enter 换行</span><span>Esc 关闭</span><span>Ctrl+Shift+V 带入剪贴板</span></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 状态栏(波4 接真值):左=项目目录;右=引擎保活 / 会话忙闲 / 编排并发 / 主题 —— 只显示有真实来源的数据 -->
  <footer id="sbar">
    <span id="sbProj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span id="sbProjName">未选目录</span></span>
    <span class="sp"></span>
    <span id="sbEng" title="引擎保活(主进程心跳聚合推送;初始探测拿不到即未连接)"><span class="dot" id="sbEngDot"></span><span id="sbEngTx">未连接</span></span>
    <span id="sbSess" title="活动会话(侧栏会话列表 + 忙闲转发)"></span>
    <span id="sbWf" title="编排并发:运行中工作流 / 上限(主进程只读 IPC,5s 轮询)"></span>
    <span id="sbTheme"></span>
  </footer>
</div>

<script>
  const BH = window.BocomHermes
  const $ = (id) => document.getElementById(id)
  // webview preload 必须是绝对 file URL(本页与内嵌页同在 ui/ 下,相对层级相同)
  const PRELOAD_URL = new URL('../preload.js', location.href).href

  // ── mac 红绿灯 inset 占位 ──
  if (/mac/i.test(navigator.platform || '')) $('tbar').classList.add('mac')

  // ── 主题:跟随广播;标题栏钮循环四主题(浅磨砂→墨玻璃→曜黑→纸白)──
  const THEMES = ['light', 'dark', 'onyx', 'paper']
  const THEME_NAMES = { light: '浅磨砂', dark: '墨玻璃', onyx: '曜黑', paper: '纸白' }
  let curTheme = document.documentElement.dataset.theme || 'light'
  function paintTheme() { $('sbTheme').textContent = '主题 ' + (THEME_NAMES[curTheme] || curTheme) }
  paintTheme()
  BH.onTheme && BH.onTheme((t) => { curTheme = t; document.documentElement.dataset.theme = t; paintTheme() })
  $('themeBtn').addEventListener('click', () => {
    curTheme = THEMES[(THEMES.indexOf(curTheme) + 1) % THEMES.length] || 'light'
    BH.setTheme(curTheme)   // 广播回来后经 onTheme 统一落 data-theme(含本页)
  })

  // ── 状态栏:项目目录(拿得到什么显示什么)──
  ;(function () {
    try {
      const name = BH.getProject && BH.getProject()
      let dir = ''
      try { const s = BH.getSettings && BH.getSettings(); dir = (s && s.projectDir) || '' } catch (e) {}
      $('sbProjName').textContent = name || (dir ? dir.split(/[\\/]/).pop() : '未选目录')
      $('sbProj').title = dir || ''
    } catch (e) {}
  })()

  // ── 视图切换(同时只显一个;webview 懒创建且保活)──
  const VIEW_SRC = { orch: 'dock.html?embed=1', mail: 'mailcenter.html?embed=1', settings: 'settings.html?embed=1' }
  const viewWv = {}   // view 名 → webview(保活,切走仅隐藏)
  function ensureWebview(view) {
    if (viewWv[view]) return viewWv[view]
    const box = $('view-' + view); if (!box) return null
    const wv = document.createElement('webview')
    wv.setAttribute('src', VIEW_SRC[view])
    wv.setAttribute('preload', PRELOAD_URL)
    box.appendChild(wv)
    viewWv[view] = wv
    return wv
  }
  function showView(view) {
    if (view === 'browser') {   // 内嵌浏览器:不开视图,唤起现有工作台窗(功率工具保持独立)
      try { BH.openBrowser && BH.openBrowser() } catch (e) {}
      return
    }
    if (view === 'kb') view = 'settings'   // 知识库治理在设置视图内,波1 归并到设置
    for (const v of ['chat', 'orch', 'mail', 'settings']) {
      const el = $('view-' + v); if (el) el.classList.toggle('on', v === view)
    }
    document.querySelectorAll('.nav-item').forEach((b) => {
      const bv = b.dataset.view === 'kb' ? 'settings' : b.dataset.view
      b.classList.toggle('on', bv === view)
    })
    if (view !== 'chat') ensureWebview(view)
  }
  document.querySelectorAll('.nav-item').forEach((b) => b.addEventListener('click', () => showView(b.dataset.view)))

  // ── 对话视图:多会话工作台(波2)── 每会话一个 webview 保活(切走仅隐藏);Map 维护 wcId/sid/标题/忙闲 ──
  const chats = new Map()   // key → {key, wv, wcId, sid, title, wf, busy, cardId, ready, pending}
  let activeKey = '', chatSeq = 0
  const DOTS = ['var(--accent)', 'var(--green)', '#e8a13c', '#9b7ede']   // 状态点按 sid hash 取色(blue/green/orange/purple)
  const dotColor = (sid) => { let h = 0; const s = String(sid || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return DOTS[h % DOTS.length] }
  const ensureEmptyState = () => { $('chatEmpty').style.display = chats.size ? 'none' : '' }

  function renderSessList() {
    const box = $('sessList'); box.innerHTML = ''
    for (const c of chats.values()) {
      const row = document.createElement('div')
      row.className = 'sess' + (c.key === activeKey ? ' on' : '')
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = dotColor(c.sid || c.key)
      row.appendChild(dot)
      if (c.busy) { const sp = document.createElement('span'); sp.className = 'spin'; sp.title = '运行中'; row.appendChild(sp) }
      const t = document.createElement('span'); t.className = 't'; t.textContent = c.title || '新会话'; t.title = t.textContent
      row.appendChild(t)
      if (c.wf) { const b = document.createElement('span'); b.className = 'wfbd'; b.textContent = '编排'; row.appendChild(b) }
      const pin = document.createElement('button'); pin.className = 'pin'; pin.textContent = '📌'; pin.title = '钉出为独立迷你卡(盯梢此会话)'
      pin.addEventListener('click', (ev) => { ev.stopPropagation(); pinChat(c.key) })
      row.appendChild(pin)
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = '关闭会话'
      x.addEventListener('click', (ev) => { ev.stopPropagation(); closeChat(c.key) })
      row.appendChild(x)
      // 拖出手势起点(波3):按钮区不启拖;位移 >8px 才算拖出,<8px 仍是点击切换
      row.addEventListener('mousedown', (ev) => {
        if (ev.button !== 0) return
        if (ev.target && ev.target.closest && (ev.target.closest('.x') || ev.target.closest('.pin'))) return
        suppressClick = false   // 新手势清掉上一轮的拖拽抑制(防陈旧标记误吞正常点击)
        dragSess = { key: c.key, x0: ev.screenX, y0: ev.screenY, dragging: false, ghost: null, row }
      })
      row.addEventListener('click', () => { if (suppressClick) { suppressClick = false; return } activateChat(c.key) })
      box.appendChild(row)
    }
    // 历史区:最近 8 条(排除已在活动列表的 sid 与钉出中的 sid),点击 = 带 sid 重开(引擎在则续接,没了回本地转录回放)
    const hbox = $('histList'); hbox.innerHTML = ''
    let hist = []
    try { hist = (BH.getHistory && BH.getHistory()) || [] } catch (e) {}
    const act = new Set([...chats.values()].map((c) => c.sid).filter(Boolean))
    const items = hist.filter((h) => h && h.id && !act.has(h.id) && !pinnedSids.has(h.id)).slice(0, 8)
    $('histLab').style.display = items.length ? '' : 'none'
    for (const h of items) {
      const row = document.createElement('div')
      row.className = 'sess'
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = 'var(--txt3)'
      const t = document.createElement('span'); t.className = 't'; t.textContent = h.title || '对话'
      t.title = (h.title || '') + (h.project ? ' · ' + h.project : '')
      row.append(dot, t)
      row.addEventListener('click', () => spawnChat({ sid: h.id, title: h.title }))
      hbox.appendChild(row)
    }
    paintSessStatus()   // 状态栏会话数(波4):每次重渲顺带刷新(会话 Map 的一切变更都汇聚到本函数)
  }

  // ── 状态栏·会话(波4)── 真源 = 本页会话 Map + onShellSessStatus 忙闲转发;「会话 N · 忙 M」忙数高亮 ──
  function paintSessStatus() {
    const el = $('sbSess'); if (!el) return
    let busy = 0
    for (const c of chats.values()) if (c.busy) busy++
    el.textContent = '会话 ' + chats.size
    if (busy) { const b = document.createElement('span'); b.className = 'busyN'; b.textContent = ' · 忙 ' + busy; el.appendChild(b) }
  }

  function activateChat(key) {
    const c = chats.get(key); if (!c) return
    if (!c.wv) { spawnChat({ sid: c.sid, title: c.title }); return }   // 收养的条目(无 webview):带 sid 重开
    activeKey = key
    showView('chat')
    for (const x of chats.values()) if (x.wv) x.wv.style.display = x.key === key ? 'flex' : 'none'
    renderSessList()
  }
  function closeChat(key) {
    const c = chats.get(key); if (!c) return
    chats.delete(key)   // 先摘:webview destroyed 兜底与 sessionClose 双通道幂等(清理链本身也幂等)
    if (c.wcId != null) { try { BH.sessionClose && BH.sessionClose(c.wcId) } catch (e) {} }   // 卡关闭清理链:abort 会话/retire serve/forgetBusy
    if (c.wv) { try { c.wv.remove() } catch (e) {} }   // 摘出 DOM 即销毁 guest webContents
    if (activeKey === key) { activeKey = ''; const first = chats.keys().next().value; if (first) activateChat(first) }
    ensureEmptyState(); renderSessList()
  }

  // ── 钉出/收回(波3)── 钉出 = 会话挪进独立迷你卡(真窗口);收回 = 钉出窗关闭,会话回侧栏 ──
  const pinnedSids = new Set()   // 钉出中的 sid:历史区据此过滤(钉出 = "它在外面",别再从历史重开打成双绑)
  let dragSess = null            // 拖出手势状态 { key, x0, y0, dragging, ghost, row }
  let suppressClick = false      // 拖拽收尾的那个 click 不算"点击切换"
  function flashStatus(t) {   // 状态栏右侧短暂提示(3s 自恢复;钉出失败等瞬态反馈,不引入 toast 体系)
    const el = $('sbTheme'); if (!el) return
    const old = el.textContent; el.textContent = t
    setTimeout(() => { el.textContent = old }, 3000)
  }
  function titleForSid(sid) {
    try { const h = ((BH.getHistory && BH.getHistory()) || []).find((x) => x && x.id === sid); return (h && h.title) || '' } catch (e) { return '' }
  }
  // 钉出:主进程开真窗口重接(detach 语义,会话不 abort);回包 ok 后才移除 webview 与条目 —— 绝不走 sessionClose
  async function pinChat(key, pos) {
    const c = chats.get(key); if (!c) return
    if (!c.sid) { flashStatus('会话尚未就绪,稍候再钉'); return }
    const arg = { sid: c.sid }
    if (pos && Number.isFinite(pos.x) && Number.isFinite(pos.y)) { arg.x = Math.round(pos.x); arg.y = Math.round(pos.y) }
    let r = null
    try { r = await (BH.sessionPinOut && BH.sessionPinOut(arg)) } catch (e) { r = { ok: false, err: String((e && e.message) || e) } }
    if (!r || !r.ok) { flashStatus('钉出失败:' + ((r && r.err) || '未知错误')); return }
    pinnedSids.add(c.sid)
    chats.delete(key)   // 先摘:webview destroyed 兜底看到 key 不在即空转
    if (c.wv) { try { c.wv.remove() } catch (e) {} }   // 摘 DOM 即销毁 guest;会话由钉出窗自持
    if (activeKey === key) { activeKey = ''; const first = chats.keys().next().value; if (first) activateChat(first) }
    ensureEmptyState(); renderSessList()
  }
  // 拖出手势:条目 mousedown 记起点(见 renderSessList);>8px 进拖拽态(条目半透明 + 标题幻影贴光标),
  // mouseup 以光标屏幕坐标钉出。document 级监听:mousedown 起于本窗内,Chromium 拖出窗外交互期间仍会回报本窗。
  document.addEventListener('mousemove', (ev) => {
    const d = dragSess; if (!d) return
    if (!d.dragging) {
      if (Math.hypot(ev.screenX - d.x0, ev.screenY - d.y0) <= 8) return
      d.dragging = true
      const c = chats.get(d.key)
      if (d.row) d.row.classList.add('dragging')
      d.ghost = document.createElement('div')
      d.ghost.className = 'dragGhost'
      d.ghost.textContent = '📌 ' + ((c && c.title) || '会话')
      document.body.appendChild(d.ghost)
      document.body.style.cursor = 'grabbing'
    }
    if (d.ghost) { d.ghost.style.left = (ev.clientX + 14) + 'px'; d.ghost.style.top = (ev.clientY + 12) + 'px' }
  })
  document.addEventListener('mouseup', (ev) => {
    const d = dragSess; dragSess = null
    if (!d) return
    if (d.row) d.row.classList.remove('dragging')
    if (d.ghost) { try { d.ghost.remove() } catch (e) {} }
    document.body.style.cursor = ''
    if (d.dragging) {
      suppressClick = true   // 拖拽收尾的 click 不算"点击切换"(条目随即被钉出移除)
      pinChat(d.key, { x: ev.screenX, y: ev.screenY })
    }
  })

  // 发卡收口落点:主进程 spawnCard → shell-spawn {id,title,sid,msg,disp,orch,wf};
  // 本地「新建对话」(仅 title)、历史点击(sid+title)、wf-open 聚焦(仅 sid)同走这里
  function spawnChat(p) {
    p = p || {}
    showView('chat')
    if (p.sid) {   // 同 sid 已开 → 激活;收养条目(无 webview)摘掉重建
      for (const c of [...chats.values()]) {
        if (c.sid === p.sid) {
          if (c.wv) { activateChat(c.key); return }
          chats.delete(c.key); break
        }
      }
    }
    const key = 'c' + (++chatSeq)
    // query 字段与主进程 spawnCard 真窗口路径一一对应;chat=1 与工作台调试助手卡区分(card.html embedded 分支)
    const q = new URLSearchParams({ embedded: '1', chat: '1', title: p.title || '新会话' })
    if (p.id) q.set('id', p.id)       // 卡 id:附件暂存(getCardFiles)与 wf 注册表(session-bind)都靠它对上
    if (p.sid) q.set('sid', p.sid)
    if (p.msg) q.set('msg', p.msg)
    if (p.disp) q.set('disp', p.disp)
    if (p.orch) q.set('orch', '1')
    if (p.wf) q.set('wf', '1')
    const wv = document.createElement('webview')
    wv.setAttribute('src', 'card.html?' + q.toString())
    wv.setAttribute('preload', PRELOAD_URL)
    wv.style.display = 'none'
    const c = { key, wv, wcId: null, sid: p.sid || null, title: p.title || '新会话', wf: !!p.wf, busy: false, cardId: p.id || '', ready: false, pending: '' }
    chats.set(key, c)
    wv.addEventListener('dom-ready', () => {
      c.ready = true
      try { c.wcId = wv.getWebContentsId(); if (c.wcId != null && BH.sessionBind) BH.sessionBind(c.cardId, c.wcId) } catch (e) {}   // 登记 wcId↔卡(wf 注册表补 wcId)
      ensureEmptyState()
      if (c.pending) { const t = c.pending; c.pending = ''; fillChat(t) }
    })
    wv.addEventListener('ipc-message', (ev) => {   // guest 经 sendToHost 回写绑定(card.html cardBoundEmit):创建时不知 sid,在此绑定
      if (ev.channel !== 'card-bound') return
      const m = ev.args && ev.args[0]; if (!m) return
      if (m.sid && c.sid !== m.sid) c.sid = m.sid
      if (m.title) c.title = m.title
      renderSessList()
    })
    wv.addEventListener('destroyed', () => {   // 兜底:webview 被销毁(非走 × 的路径)幂等收尾
      if (!chats.has(key)) return
      chats.delete(key)
      if (c.wcId != null) { try { BH.sessionClose && BH.sessionClose(c.wcId) } catch (e) {} }
      if (activeKey === key) activeKey = ''
      ensureEmptyState(); renderSessList()
    })
    $('view-chat').appendChild(wv)
    ensureEmptyState()
    activateChat(key)
  }

  // 把文本填进当前活动会话卡的输入框(#ci,textarea)并聚焦;无会话先建,未就绪先暂存 dom-ready 后补填
  function fillChat(t) {
    const c = activeKey ? chats.get(activeKey) : null
    if (!c) { spawnChat({ title: '新会话' }); const nc = activeKey ? chats.get(activeKey) : null; if (nc) nc.pending = t; return }
    if (!c.wv) { spawnChat({ sid: c.sid, title: c.title }); const nc = activeKey ? chats.get(activeKey) : null; if (nc) nc.pending = t; return }   // 收养条目先重开
    if (!c.ready) { c.pending = t; return }
    const js = '(function(){var ci=document.getElementById("ci");if(ci){ci.value=' + JSON.stringify(String(t))
      + ';ci.focus();ci.dispatchEvent(new Event("input",{bubbles:true}))}})();void 0'
    try { c.wv.executeJavaScript(js).catch(() => {}) } catch (e) {}
  }
  $('newChat').addEventListener('click', () => spawnChat({ title: '新会话' }))
  $('newChatBig').addEventListener('click', () => spawnChat({ title: '新会话' }))

  // 收养:shell 重载(刷新/崩溃重开)前主进程里还活着的内嵌会话 → 先列进侧栏,点击带 sid 重开;
  // 钉出中的会话(独立窗活着,不随 shell 重载死)不收养 —— 记进 pinnedSids,收回时经 session-reattached 回来
  ;(async () => {
    try {
      const list = await (BH.sessionList ? BH.sessionList() : Promise.resolve([]))
      for (const s of (list || [])) {
        if (!s || !s.sid) continue
        if (s.pinned) { pinnedSids.add(s.sid); continue }
        if (!s.embed) continue
        const key = 'c' + (++chatSeq)
        chats.set(key, { key, wv: null, wcId: s.wcId != null ? s.wcId : null, sid: s.sid, title: s.title || '对话', wf: !!s.wf, busy: !!s.busy, cardId: '', ready: false, pending: '' })
      }
      if (chats.size) { ensureEmptyState(); renderSessList() }
    } catch (e) {}
  })()

  // ── 主进程广播 ──
  // 热键/托盘带来文本(如 Ctrl+Shift+V 剪贴板):聚焦对话视图,无会话则新建,dom-ready 后填入
  BH.onFillInput && BH.onFillInput((text) => { showView('chat'); fillChat(text) })
  // 热键切视图:shell-view {view}
  BH.onShellView && BH.onShellView((p) => { if (p && p.view) showView(p.view) })
  // 发卡收口(波2):主进程 spawnCard 改道 → 对话视图开/激活会话
  BH.onShellSpawn && BH.onShellSpawn((p) => spawnChat(p || {}))
  // 会话忙闲(card-busy 转发):按 wcId 找条目改状态点/转圈
  BH.onShellSessStatus && BH.onShellSessStatus((p) => {
    if (!p) return
    for (const c of chats.values()) { if (c.wcId != null && c.wcId === p.wcId) { c.busy = !!p.busy; renderSessList(); break } }
  })
  // 收回(波3):钉出窗被关 → 主进程通知 → 按 sid 重建 webview(shell-spawn {sid} 同路径:在则激活,不在则 card-init 续接重建)
  BH.onSessionReattached && BH.onSessionReattached((p) => {
    if (!p || !p.sid) return
    pinnedSids.delete(p.sid)
    spawnChat({ sid: p.sid, title: titleForSid(p.sid) || '对话' })
  })

  // ── 快捷输入层(波4)── 主进程热键 send('shell-quick-open') → 唤起;Enter = 隐藏 + 发卡收口同路径开新会话 ──
  const quickMask = $('quickMask'), qiTa = $('qiTa')
  let quickOpen = false
  function qiAuto() {   // 单行起,随内容自动长高(120px 上限由 CSS max-height 兜,超出滚动)
    try { qiTa.style.height = 'auto'; qiTa.style.height = Math.min(qiTa.scrollHeight, 120) + 'px' } catch (e) {}
  }
  function openQuick(text) {
    quickOpen = true
    quickMask.classList.add('on')
    const box = $('quickIn')
    box.classList.remove('in'); void box.offsetWidth; box.classList.add('in')   // 强制 reflow:150ms 淡入动画每次唤起都能重播
    if (typeof text === 'string' && text) qiTa.value = text
    qiAuto()
    setTimeout(() => { try { qiTa.focus(); qiTa.setSelectionRange(qiTa.value.length, qiTa.value.length) } catch (e) {} }, 0)
  }
  function closeQuick() {
    quickOpen = false
    quickMask.classList.remove('on')
    qiTa.value = ''; qiTa.style.height = ''   // 关闭即清空:下次唤起是干净的输入条
  }
  qiTa.addEventListener('input', qiAuto)
  qiTa.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault()
      const t = qiTa.value.trim()
      closeQuick()
      // 与 shell-spawn {title,msg} 同一落点(spawnChat):title 截 20 字;card embedded 带 msg 自动首发,内部切到对话视图
      if (t) spawnChat({ title: t.slice(0, 20), msg: t })
    } else if (ev.key === 'Escape') { ev.preventDefault(); closeQuick() }
  })
  quickMask.addEventListener('mousedown', (ev) => { if (ev.target === quickMask) closeQuick() })   // 点击遮罩关闭
  document.addEventListener('keydown', (ev) => { if (quickOpen && ev.key === 'Escape') closeQuick() })   // 焦点不在输入框也能 Esc
  BH.onShellQuickOpen && BH.onShellQuickOpen((p) => { openQuick(p && p.text) })

  // ── 状态栏·引擎保活(波4)── 真源 = 主进程保活心跳聚合推送(serve-health);标题栏引擎 chip 与本灯同源 ──
  function paintEngine(st) {   // st: {state:'none'|'ok'|'down', port}
    const eng = $('sbEng'), tx = $('sbEngTx'), cd = $('chipDot'), ct = $('chipTx')
    if (!eng || !tx || !cd || !ct) return
    eng.classList.toggle('ok', st.state === 'ok')
    if (st.state === 'ok') { tx.textContent = '引擎 :' + st.port; cd.style.background = 'var(--green)'; ct.textContent = '引擎 :' + st.port }
    else if (st.state === 'down') { tx.textContent = '引擎失连'; cd.style.background = 'var(--txt3)'; ct.textContent = '引擎失连' }
    else { tx.textContent = '未连接'; cd.style.background = 'var(--txt3)'; ct.textContent = '引擎未连接' }
  }
  paintEngine({ state: 'none' })
  BH.onServeHealth && BH.onServeHealth((p) => {
    if (!p) return
    paintEngine(p.healthy && p.port ? { state: 'ok', port: p.port } : { state: 'down', port: p.port })
  })
  // 初始态:走现有探针接口当场探一次 —— shell 顶层 webContents 没有卡会话,probeNow 多半回 null,
  // 此时保持「未连接」等首次心跳推送,不造假数据
  ;(async () => {
    try {
      const r = await (BH.probeNow ? BH.probeNow() : Promise.resolve(null))
      if (r && r.port != null) paintEngine(r.healthy ? { state: 'ok', port: r.port } : { state: 'down', port: r.port })
    } catch (e) {}
  })()

  // ── 状态栏·编排并发(波4)── 真源 = 主进程只读 IPC wf-running-count({running,max});5s 轮询,页面隐藏即停 ──
  let wfTimer = null
  async function pollWf() {
    try {
      const r = await (BH.wfRunningCount ? BH.wfRunningCount() : Promise.resolve(null))
      if (r && $('sbWf')) $('sbWf').textContent = '编排 ' + (r.running || 0) + '/' + (r.max || 0)
    } catch (e) {}
  }
  function startWfPoll() { if (wfTimer) return; pollWf(); wfTimer = setInterval(pollWf, 5000) }
  function stopWfPoll() { if (wfTimer) { clearInterval(wfTimer); wfTimer = null } }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopWfPoll(); else startWfPoll() })
  startWfPoll()
  paintSessStatus()   // 初始亮一次「会话 0」(无会话时 adoption 不触发 renderSessList)
</script>
</body>
</html>
